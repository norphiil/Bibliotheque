version: '3.8'

services:
  bibliotheque:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kandorya-bibliotheque
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Flask Configuration
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - SECRET_KEY=${SECRET_KEY:-kandorya-secret-key-change-in-production}
      
      # Application Configuration
      - UPLOAD_FOLDER=sources
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      
      # API Keys - À définir dans un fichier .env
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - OLLAMA_SERVER_URL=${OLLAMA_SERVER_URL:-}
    networks:
      - bibliotheque-network
      - traefik_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.library.rule=Host(`library.voulkai.nocturlab.fr`)"
      - "traefik.http.services.library.loadbalancer.server.port=5000"
networks:
  bibliotheque-network:
    driver: bridge
  traefik_default:
    external: true