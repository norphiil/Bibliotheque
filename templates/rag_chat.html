<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>RAG Chatbot</h1>
        <div id="chat-history"></div>
        <form id="chat-form">
            <input type="text" id="message" placeholder="Type your message...">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        document.getElementById('chat-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            const messageInput = document.getElementById('message');
            const message = messageInput.value;
            messageInput.value = '';

            const chatHistory = document.getElementById('chat-history');
            const userMessage = document.createElement('div');
            userMessage.className = 'message user-message';
            userMessage.textContent = message;
            chatHistory.appendChild(userMessage);

            const response = await fetch('/api/rag_chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ message })
            });

            const data = await response.json();
            const botMessage = document.createElement('div');
            botMessage.className = 'message bot-message';

            let responseHTML = `<p>${data.response}</p>`;
            if (data.source_documents) {
                responseHTML += '<h3>Sources:</h3>';
                data.source_documents.forEach(doc => {
                    responseHTML += `<div class="source-doc">
                        <h4>${doc.source}</h4>
                        <p>${doc.page_content}</p>
                    </div>`;
                });
            }

            botMessage.innerHTML = responseHTML;
            chatHistory.appendChild(botMessage);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        });
    </script>
</body>
</html>
